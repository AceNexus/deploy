# ============================================================
# 此檔案包含 4 個 K8s 物件，用 --- 分隔：
#   1. PersistentVolumeClaim → Grafana 資料持久化（Dashboard、Annotation 等）
#   2. ConfigMap  → Grafana datasource 自動佈建設定（指向 Tempo）
#   3. Deployment → Grafana 容器（匿名 Admin，免登入）
#   4. Service    → Grafana 網路入口（LoadBalancer :3000，本機直接開啟）
# ============================================================

# ============================================================
# [1/4] PersistentVolumeClaim - Grafana 資料持久化
# ============================================================
# Grafana 的 Dashboard、Annotation、Preferences 等儲存於 /var/lib/grafana/grafana.db（SQLite）。
# 若無 PVC，Pod 重啟後資料全部消失。
# datasource（Tempo）由 ConfigMap 自動佈建，不受影響。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data-pvc
  namespace: acenexus
spec:
  accessModes:
    - ReadWriteOnce  # 同時只能被一個 Pod 掛載（Grafana 單節點夠用）
  resources:
    requests:
      storage: 1Gi

---

# ============================================================
# [2/4] ConfigMap - Grafana Datasource 佈建
# ============================================================
# Grafana 啟動時會自動讀取 /etc/grafana/provisioning/datasources/
# 並將此 ConfigMap 掛入，讓 Tempo 資料源免手動設定
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: acenexus
data:
  tempo.yaml: |
    apiVersion: 1
    datasources:
      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo:3200   # K8s 內部 Service DNS，不需 port-forward
        access: proxy
        isDefault: true
        jsonData:
          httpMethod: GET
          serviceMap:
            datasourceUid: tempo
          nodeGraph:
            enabled: true
          traceQuery:
            timeShiftEnabled: true
            spanStartTimeShift: 1h
            spanEndTimeShift: -1h
          spanBar:
            type: Duration

---

# ============================================================
# [3/4] Deployment - Grafana 容器
# ============================================================
# GF_AUTH_ANONYMOUS_* → 匿名 Admin 免登入（同舊 docker-compose 行為）
# GF_AUTH_DISABLE_LOGIN_FORM → 隱藏登入表單，直接進入 UI
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: acenexus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000

          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_AUTH_DISABLE_SIGNOUT_MENU
              value: "true"

          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-data
              mountPath: /var/lib/grafana  # Grafana SQLite DB、Dashboard 等持久化資料

          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5

          # livenessProbe：偵測 Grafana 假死（SQLite 鎖死、前端無回應等），自動觸發重啟
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30  # 比 readinessProbe 多 20s，避免啟動期誤殺
            periodSeconds: 30        # 每 30 秒檢查一次
            failureThreshold: 3      # 連續失敗 3 次（90 秒）才重啟
            timeoutSeconds: 5

      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources   # 對應上方 ConfigMap 的 name
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-data-pvc  # 對應上方建立的 PVC

---

# ============================================================
# [4/4] Service - Grafana 網路入口
# ============================================================
# LoadBalancer → Docker Desktop K8s 將 localhost:3000 對應至此 Service
# 開啟瀏覽器直接訪問 http://localhost:3000（匿名 Admin，免登入）
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: acenexus
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
  type: LoadBalancer
