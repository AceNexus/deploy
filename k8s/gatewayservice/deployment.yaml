# ============================================================
# 此檔案包含 2 個 K8s 物件，用 --- 分隔：
#   1. Deployment → gatewayservice 容器
#   2. Service    → gatewayservice 網路入口
# ============================================================

# ============================================================
# [1/2] Deployment - gatewayservice 容器
# ============================================================
# 對應 docker-compose 的 gatewayservice: image / environment / healthcheck / deploy
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatewayservice
  namespace: acenexus
spec:
  replicas: 1

  selector:
    matchLabels:
      app: gatewayservice

  template:
    metadata:
      labels:
        app: gatewayservice
    spec:
      # initContainers：依序等待 configservice 和 eurekaservice 就緒後才啟動。
      # gatewayservice 啟動時需要從 Config Server 拉取設定，並向 Eureka 註冊。
      # 對應 docker-compose 的 depends_on: configservice + eurekaservice: condition: service_healthy
      # gatewayservice 路由改為直接打 K8s Service DNS（http://nexusbot:5001），
      # 不再依賴 Eureka，故移除 wait-for-eurekaservice initContainer
      initContainers:
        - name: wait-for-configservice
          image: busybox:1.36
          command: [ 'sh', '-c', 'until nc -z configservice 8888; do echo waiting for configservice; sleep 5; done' ]

      terminationGracePeriodSeconds: 60

      containers:
        - name: gatewayservice
          image: gatewayservice:local  # 本地 build 的 image
          imagePullPolicy: Never       # Never = 只用本地 image，不去網路拉
          # 若改成 IfNotPresent 且本地沒有，會嘗試去 Docker Hub 拉而失敗
          ports:
            - containerPort: 8080

          # 環境變數，對應 docker-compose 的 environment:
          env:
            - name: SERVER_HOST
              value: "gatewayservice"   # K8s Service name，讓服務知道自己的對外位址
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"             # prod profile 啟用 Config Server 和 Eureka 整合
            - name: SECURITY_USERNAME   # Gateway 管理介面的 HTTP Basic Auth 帳號
              valueFrom:
                secretKeyRef:
                  name: gatewayservice-secret
                  key: security-username
            - name: SECURITY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gatewayservice-secret
                  key: security-password
            - name: CONFIG_SERVER_URI
              value: "http://configservice:8888"  # 直接指向 K8s 內部的 configservice Service
            - name: CONFIG_SERVER_USERNAME  # 連接 Config Server 的帳號（= configservice 的 SECURITY_USERNAME）
              valueFrom:
                secretKeyRef:
                  name: gatewayservice-secret
                  key: config-server-username
            - name: CONFIG_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gatewayservice-secret
                  key: config-server-password
            # Eureka 已在 gatewayservice-prod.yml 中設定 enabled: false，無需相關環境變數
            - name: RABBITMQ_HOST
              value: "rabbitmq"         # 直接寫 Service name，K8s DNS 會自動解析成 Pod IP
            - name: RABBITMQ_PORT
              value: "5672"             # 明確指定，避免 K8s 自動注入 RABBITMQ_PORT=tcp://ip:port 導致 Spring Boot 解析失敗
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gatewayservice-secret
                  key: rabbitmq-username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gatewayservice-secret
                  key: rabbitmq-password
            - name: JWT_SECRET          # JWT 簽章金鑰，用於驗證 Bearer Token
              valueFrom:
                secretKeyRef:
                  name: gatewayservice-secret
                  key: jwt-secret
            - name: TRACING_SAMPLING_PROBABILITY
              value: "0.0" # 改成 1.0 可開啟完整追蹤
            - name: MANAGEMENT_OTLP_TRACING_ENDPOINT
              value: "http://tempo:4318/v1/traces"  # 送至 K8s 內的 Tempo Service

          resources:
            requests:
              memory: 256Mi
              cpu: 200m
            limits:
              memory: 512Mi
              cpu: 1000m   # 1000m = 1 顆 CPU

          lifecycle:
            preStop:
              exec:
                command: [ "sh", "-c", "sleep 5" ]

          # readinessProbe：打 /actuator/health 確認 Spring Boot 完全啟動
          # /actuator/health 已設定為 JWT bypass，可直接用 httpGet 不需帶憑證
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30   # 等 30 秒後才開始檢查（JVM 啟動需要時間）
            periodSeconds: 15         # 每 15 秒檢查一次
            failureThreshold: 5       # 連續失敗 5 次（75 秒）才標記為 not ready

          # livenessProbe：偵測 gatewayservice 假死（WebFlux 執行緒耗盡、OOM 後假死等），自動觸發重啟
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90  # 比 readinessProbe 多 60s，避免啟動期誤殺
            periodSeconds: 30        # 每 30 秒檢查一次
            failureThreshold: 3      # 連續失敗 3 次（90 秒）才重啟
            timeoutSeconds: 5

---

# ============================================================
# [2/2] Service - gatewayservice 網路入口
# ============================================================
# 所有外部流量的統一入口（LINE Webhook、前端請求等）
# 正式環境：透過 Ingress + LoadBalancer 對外暴露
# 本機測試：使用 port-forward 暫時開放
apiVersion: v1
kind: Service
metadata:
  name: gatewayservice
  namespace: acenexus
spec:
  selector:
    app: gatewayservice
  ports:
    - port: 8080
      targetPort: 8080
  type: LoadBalancer        # 本機開發：Docker Desktop K8s 會將 localhost:8080 對應至此 Service
  # 正式環境部署時改回 ClusterIP，由 Ingress 控制對外流量
