# ============================================================
# 此檔案包含 2 個 K8s 物件，用 --- 分隔：
#   1. Deployment → nexusbot 容器
#   2. Service    → nexusbot 網路入口
# ============================================================

# ============================================================
# [1/2] Deployment - nexusbot 容器
# ============================================================
# 對應 docker-compose 的 nexusbot: image / environment / healthcheck / deploy
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexusbot
  namespace: acenexus
spec:
  replicas: 1

  selector:
    matchLabels:
      app: nexusbot

  template:
    metadata:
      labels:
        app: nexusbot
    spec:
      # initContainers：依序等待 configservice、eurekaservice、gatewayservice 就緒後才啟動。
      # nexusbot 啟動時需要從 Config Server 拉取設定，並向 Eureka 註冊，再透過 Gateway 對外提供服務。
      # 對應 docker-compose 的 depends_on: configservice + eurekaservice + gatewayservice: condition: service_healthy
      imagePullSecrets:
        - name: ghcr-secret

      initContainers:
        - name: wait-for-configservice
          image: busybox:1.36
          command: [ 'sh', '-c', 'until nc -z configservice 8888; do echo waiting for configservice; sleep 5; done' ]
        - name: wait-for-eurekaservice
          image: busybox:1.36
          command: [ 'sh', '-c', 'until nc -z eurekaservice 8761; do echo waiting for eurekaservice; sleep 5; done' ]
        - name: wait-for-gatewayservice
          image: busybox:1.36
          command: [ 'sh', '-c', 'until nc -z gatewayservice 8080; do echo waiting for gatewayservice; sleep 5; done' ]

      # JVM 啟動慢，給足 graceful shutdown 時間（preStop 5s + Spring shutdown）
      terminationGracePeriodSeconds: 60

      containers:
        - name: nexusbot
          image: ghcr.io/acenexus/nexusbot:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5001

          # 環境變數，對應 docker-compose 的 environment:
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"             # prod profile 啟用 Config Server、Eureka、MySQL
            - name: SERVER_HOST
              value: "nexusbot"         # K8s Service name
            - name: SERVER_PORT
              value: "5001"
            - name: NEXUSBOT_BASE_URL
              value: ""                 # ngrok 啟動後填入，例如 https://xxxx.ngrok-free.app

            # Config Server
            - name: CONFIG_SERVER_URI
              value: "http://configservice:8888"
            - name: CONFIG_SERVER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nexusbot-secret
                  key: config-server-username
            - name: CONFIG_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexusbot-secret
                  key: config-server-password

            # MySQL（宿主機上的獨立 MySQL，不在 K8s 內）
            # Docker Desktop：host.docker.internal 自動解析為宿主機 IP
            # Ubuntu k3s：host.docker.internal 不可用，需改為宿主機實際 IP
            #   取得方式：kubectl get nodes -o wide（INTERNAL-IP 欄位）
            #   更新方式：kubectl set env deployment/nexusbot MYSQL_HOST=<host-ip> -n acenexus
            - name: MYSQL_HOST
              value: "host.docker.internal"  # Ubuntu k3s 需改為實際 host IP
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DATABASE
              value: "nexusbot"
            - name: MYSQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nexusbot-secret
                  key: mysql-username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexusbot-secret
                  key: mysql-password

            # RabbitMQ
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_PORT
              value: "5672"             # 明確指定，避免 K8s 自動注入 RABBITMQ_PORT=tcp://ip:port 導致 Spring Boot 解析失敗
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nexusbot-secret
                  key: rabbitmq-username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexusbot-secret
                  key: rabbitmq-password

            # Eureka
            - name: EUREKA_SERVER_HOST
              value: "eurekaservice"
            - name: EUREKA_SERVER_PORT
              value: "8761"
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "false"            # 使用 hostname 而非 IP，K8s 內部 DNS 可正確解析
            - name: EUREKA_INSTANCE_HOSTNAME
              value: "nexusbot"         # 強制用 K8s Service name 向 Eureka 註冊，避免 Gateway 解析 Pod hostname 失敗

            # LINE Bot
            - name: LINE_BOT_CHANNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nexusbot-secret
                  key: line-bot-channel-token
            - name: LINE_BOT_CHANNEL_SECRET
              valueFrom:
                secretKeyRef:
                  name: nexusbot-secret
                  key: line-bot-channel-secret

            # Groq AI
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nexusbot-secret
                  key: groq-api-key
            - name: GROQ_DEFAULT_MODEL
              value: "llama-3.1-8b-instant"

            # Email
            - name: EMAIL_HOST
              value: "smtp.gmail.com"
            - name: EMAIL_PORT
              value: "587"
            - name: EMAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nexusbot-secret
                  key: email-username
            - name: EMAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexusbot-secret
                  key: email-password
            - name: EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: nexusbot-secret
                  key: email-username
            - name: EMAIL_FROM_NAME
              value: "NexusBot 提醒通知"

            # 管理員密碼種子
            - name: ADMIN_PASSWORD_SEED
              valueFrom:
                secretKeyRef:
                  name: nexusbot-secret
                  key: admin-password-seed

            # 時區與 OSM
            - name: DEFAULT_TIMEZONE
              value: "Asia/Taipei"
            - name: OSM_OVERPASS_BASE_URL
              value: "https://overpass-api.de/api/"
            - name: OSM_USER_AGENT
              value: "NexusBot/1.0"
            - name: OSM_TOILET_TAGS
              value: "amenity=toilets"
            - name: OSM_FACILITY_TAGS
              value: "amenity=toilets"
            - name: OSM_CAROUSEL_MAX_ITEMS
              value: "5"
            - name: OSM_TIMEOUT_MS
              value: "10000"

            # Gemini Proxy（AIClient-2-API，選填）
            - name: GEMINI_PROXY_URL
              value: "http://aiclient:3100/v1"
            - name: GEMINI_PROXY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nexusbot-secret
                  key: gemini-proxy-api-key

            - name: TRACING_SAMPLING_PROBABILITY
              value: "1.0" # 1.0 = 100% 採樣（開發/demo 用）；production 建議改為 0.1
            - name: MANAGEMENT_OTLP_TRACING_ENDPOINT
              value: "http://tempo:4318/v1/traces"  # 送至 K8s 內的 Tempo Service

          resources:
            requests:
              memory: 256Mi
              cpu: 200m
            limits:
              memory: 512Mi
              cpu: 1000m   # 1000m = 1 顆 CPU

          # preStop：讓 K8s 先把此 Pod 從 Service endpoints 移除後再 shutdown，
          # 確保 Eureka deregister 在有效狀態下完成
          lifecycle:
            preStop:
              exec:
                command: [ "sh", "-c", "sleep 5" ]

          # readinessProbe：打 /actuator/health 確認 Spring Boot 完全啟動
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 5001
            initialDelaySeconds: 30   # 等 30 秒後才開始檢查（JVM 啟動需要時間）
            periodSeconds: 15         # 每 15 秒檢查一次
            failureThreshold: 5       # 連續失敗 5 次（75 秒）才標記為 not ready

          # livenessProbe：偵測 nexusbot 假死（JVM deadlock、排程器卡死、執行緒耗盡等），自動觸發重啟
          # initialDelay 設為 120s，因 nexusbot 依賴最多（Config + Eureka + MySQL + RabbitMQ + LINE Bot）
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 5001
            initialDelaySeconds: 120 # 比 readinessProbe 多 90s，確保所有依賴連線完成後才開始檢查
            periodSeconds: 30        # 每 30 秒檢查一次
            failureThreshold: 3      # 連續失敗 3 次（90 秒）才重啟
            timeoutSeconds: 5

---

# ============================================================
# [2/2] Service - nexusbot 網路入口
# ============================================================
# LINE Webhook 的流量由 gatewayservice 轉發至此
# 正式環境：ClusterIP 即可，由 gatewayservice 做路由
# 本機測試：使用 port-forward 暫時開放
apiVersion: v1
kind: Service
metadata:
  name: nexusbot
  namespace: acenexus
spec:
  selector:
    app: nexusbot
  ports:
    - port: 5001
      targetPort: 5001
  type: LoadBalancer # 本機開發：Docker Desktop K8s 將 localhost:5001 對應至此 Service
  # 正式環境部署時改回 ClusterIP，由 gatewayservice 做路由
