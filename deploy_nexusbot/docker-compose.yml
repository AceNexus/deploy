services:
  nexusbot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SERVER_PORT:-5001}:${SERVER_PORT:-5001}"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SERVER_HOST: ${SERVER_HOST}
      SERVER_PORT: ${SERVER_PORT:-5001}
      NEXUSBOT_BASE_URL: ${NEXUSBOT_BASE_URL}
      CONFIG_SERVER_URI: ${CONFIG_SERVER_URI}
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nexusbot}
      MYSQL_USERNAME: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      EUREKA_SERVER_HOST: ${EUREKA_SERVER_HOST}
      EUREKA_SERVER_PORT: ${EUREKA_SERVER_PORT:-8761}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      LINE_CHANNEL_TOKEN: ${LINE_CHANNEL_TOKEN}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_DEFAULT_MODEL: ${GROQ_DEFAULT_MODEL:-llama-3.1-8b-instant}
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-NexusBot 提醒通知}
      ADMIN_PASSWORD_SEED: ${ADMIN_PASSWORD_SEED}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Taipei}
      OSM_OVERPASS_BASE_URL: ${OSM_OVERPASS_BASE_URL:-https://overpass-api.de/api/}
      OSM_USER_AGENT: ${OSM_USER_AGENT:-NexusBot/1.0}
      OSM_TOILET_TAGS: ${OSM_TOILET_TAGS:-amenity=toilets}
      OSM_FACILITY_TAGS: ${OSM_FACILITY_TAGS:-amenity=toilets}
      OSM_CAROUSEL_MAX_ITEMS: ${OSM_CAROUSEL_MAX_ITEMS:-5}
      OSM_TIMEOUT_MS: ${OSM_TIMEOUT_MS:-10000}
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:${SERVER_PORT:-5001}/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 35s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
    restart: unless-stopped
    networks:
      - acenexus-network

networks:
  acenexus-network:
    external: true
